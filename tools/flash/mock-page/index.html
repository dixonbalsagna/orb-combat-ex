<!doctype html>
<meta charset="utf-8">
<title>flash capture mock</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// The self-test page for tools/flash/capture-web.mjs: implements the window.__flashcap contract with scenes that flash on purpose, so the capture driver and
// the frame analyser can be tested end to end without the game. Each tick is one 60 Hz frame.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = innerWidth, H = innerHeight;
cv.width = W; cv.height = H;
let scenario = 'steady', tick = 0;
// every scene gives the frame's state at a tick
const scenes = {
  steady: () => { g.fillStyle = '#777'; g.fillRect(0, 0, W, H); },
  // the whole frame black/white at 3 flashes a second (6 changes a second): at the limit, passes
  strobe3: (t) => { g.fillStyle = Math.floor(t / 10) % 2 ? '#fff' : '#000'; g.fillRect(0, 0, W, H); },
  // 4 a second: fails
  strobe4: (t) => { g.fillStyle = Math.floor(t / 7.5) % 2 ? '#fff' : '#000'; g.fillRect(0, 0, W, H); },
  // a 9% corner at 10 a second: under the area, passes
  corner9: (t) => { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.fillStyle = Math.floor(t / 3) % 2 ? '#fff' : '#000'; g.fillRect(0, 0, W * 0.3, H * 0.3); },
  // a 16% corner at 10 a second: fails
  corner16: (t) => { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.fillStyle = Math.floor(t / 3) % 2 ? '#fff' : '#000'; g.fillRect(0, 0, W * 0.4, H * 0.4); },
};
window.__flashcap = {
  ready: true,
  tick: 0,
  start(name, opts) { scenario = scenes[name] ? name : 'steady'; tick = 0; this.tick = 0; this.reduced = !!(opts && opts.reduced); scenes[scenario](0); },
  step() {
    tick += 1; this.tick = tick;
    scenes[scenario](tick);
    return new Promise((ok) => requestAnimationFrame(() => requestAnimationFrame(() => ok(tick))));
  },
};
scenes.steady(0);
</script>
