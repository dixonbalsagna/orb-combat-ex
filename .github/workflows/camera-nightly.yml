# The camera's split sweep, nightly (Camera's answer, via the EP, 2026-11-14): render/camera/tests/split_sweep.gd takes about 633 seconds on Camera's PC, too long for every push, so it runs once a night on main
# (the landing gate runs it too, by hand, before a batch lands). It passes when its own exit says so and tools/gate.mjs counts no SCRIPT ERROR lines. Nothing here gates a deploy and nothing is published;
# GitHub emails the repository owner about a failed scheduled run.
name: Camera nightly

on:
  schedule:
    - cron: '47 4 * * *'   # every night, 04:47 UTC (the flash nightly starts at 04:23)
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # GitHub's `bash` is `bash --noprofile --norc -eo pipefail {0}`: a failing command before a pipe fails the step

jobs:
  split-sweep:
    name: Camera split sweep on main
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # about 633 s on Camera's PC; not measured on a runner yet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: ./.github/actions/setup-godot
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      - name: Split sweep (the split view at every separation of the pair; Camera)
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://render/camera/tests/split_sweep.gd'
