# CI for Orb Combat EX. Free GitHub-hosted runners only, no secrets beyond the built-in
# Pages token permissions. Docs: docs/tools/README.md
#
# Node is pinned to 24.19.0 because the golden hashes in qa/golden-hashes.json
# were recorded on it (ADR 0004); on any other Node major they are skipped.
# Every action is pinned to a full commit SHA with its version in a comment.
# To bump one: look up the tag's commit, replace the SHA and the comment.
# Runners are pinned to ubuntu-24.04 (not ubuntu-latest) so a GitHub image migration cannot change a
# result without a commit here.
# Godot 4.7.2 and its web templates are pinned and SHA-512 verified in
# .github/actions/setup-godot/action.yml (used by the two Godot jobs).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run of the same branch, except on main, where every
# run finishes so a deploy is never cut off half way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qa:
    name: QA regression suite (Node 24.19.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      # No install step: qa/ and prototype/tools/ use Node built-ins only.
      - name: node qa/run-all.js
        run: node qa/run-all.js

  # The frozen JS core (ADR 0006): the prototype-parity record. It checks that the frozen core still matches the
  # prototype tick for tick and still reproduces its frozen golden record; the live gate is the GDScript check below.
  sim:
    name: Frozen JS core, prototype-parity record (Node 24.19.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      # No install step: sim/ uses Node built-ins only.
      - name: npm test --prefix sim
        run: npm test --prefix sim

  # Data validation: every data file against its JSON Schema, plus the cross-references between files
  # (tools/validate.js, docs/tools/README.md). The self-test runs first: a validator that cannot fail
  # proves nothing. Node built-ins only, so no install step. Free and fast (a few seconds).
  data:
    name: Data validation (schemas and cross-references)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Validator self-test
        run: node tools/validate.js --self-test
      - name: Moveset generator tests (tools/movegen: the port matches the reference, Legal's names screen holds)
        run: node tools/movegen/test/run.mjs
      - name: Validate the data
        run: node tools/validate.js
      # The sim must use its own math, random numbers and clock, never the engine's (docs/tools/determinism-lint.md): a bare sin, cos, atan2, PI, TAU, randf or clock under sim/ fails the job.
      - name: Determinism lint self-test
        run: node tools/lint-determinism-selftest.mjs
      - name: Determinism lint (no engine trig, PI, random numbers or clock in the sim)
        run: node tools/lint-determinism.mjs
      # Platform's phone head block in export_presets.cfg must match docs/perf/web-shell/ (node built-ins, a fifth of a second).
      - name: The web export's phone head is current
        run: node docs/perf/tools/web-head.mjs --check

  # Photosensitivity check, half 1 (docs/tools/flash-check.md; Legal's condition for the public web build, WCAG 2.2 criterion 2.3.1): plays the worst cases
  # (a mash, a beam clash, a signature, the transformation, a building collapse, real AI matches) in normal and in reduced-flashing mode, headless, and recounts
  # the flash register's log: more than 3 granted flashes in any 60 ticks (1 under reduced flashing) fails. It is a count of the sources that ask the register,
  # not a luminance measurement and not a clearance; the pixel half runs over captured frames (tools/flash/analyse-frames.js) and is not in CI yet.
  # The negative control proves the chain can fail: four flashes the register cannot refuse must make the recount fail.
  flash:
    name: Flash count (worst cases, flash register)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Flash analysers' self-test
        run: node tools/flash/selftest.js
      - name: Release-pass rules self-test (what makes a recorded pass stale)
        run: node tools/flash/release-pass-selftest.mjs
      # The interim playable site (Legal's interim terms): the gate, the links, the shipped defaults and the expiry are checked on a stub export, every way they can be broken.
      - name: Interim site self-test (the click-through, no autoplay, no skip link, Reduce flashing on by default, the expiry)
        run: node tools/site-interim-selftest.mjs
      - name: Pinned deploy self-test (a later game commit leaves the published /play/ byte-identical)
        run: node tools/site-pin-selftest.mjs
      - name: Nightly seed run self-test (new seeds, never repeated; the take-down trigger)
        run: node tools/flash/nightly-selftest.mjs
      - name: Gate wrapper self-test (a Godot gate whose log has SCRIPT ERROR lines fails, whatever its exit code)
        run: node tools/gate-selftest.mjs
      # Headless Chrome (preinstalled on the runner) plays a page that flashes on purpose through the capture driver and the frame analyser.
      - name: Pixel pipeline self-test (headless Chrome, mock page)
        run: node tools/flash/pixel-selftest.mjs --require-browser
      - name: Clip identity self-test (a clip records its seed and pairing; two different matches are not shown side by side)
        run: node tools/flash/clip-id-selftest.mjs --require-browser
      - uses: ./.github/actions/setup-godot
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      - name: Play the worst cases
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://tools/flash/flash_worst.gd -- --out="${RUNNER_TEMP}/flash"'
      - name: Recount the register's log
        run: node tools/flash/check-log.js "${RUNNER_TEMP}/flash"
      - name: Negative control (the recount must fail on four unrefusable flashes)
        run: |
          "$GODOT" --headless --path . --script res://tools/flash/flash_worst.gd -- --only=mash --ticks=300 --negative-control --out="${RUNNER_TEMP}/flash-neg"
          if node tools/flash/check-log.js "${RUNNER_TEMP}/flash-neg" --allow-missing > "${RUNNER_TEMP}/flash-neg.txt"; then echo "the negative control passed: the check cannot fail"; exit 1; fi
          grep -q "in the 60 ticks from" "${RUNNER_TEMP}/flash-neg.txt"

  # The GDScript port against the JS reference sim's golden vectors, plus the render
  # checks. The sim job above does not set GODOT, so `npm test --prefix sim` skips its
  # godot stage there and the parity check runs once, here. The .godot/ import cache is
  # created on the runner only (it is gitignored and never committed).
  godot-parity:
    name: Godot headless checks (parity, determinism, seam)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      # A fresh clone has no class cache: the import pass registers the class_name scripts.
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      - name: GDScript parity
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://sim/core/tools/parity.gd'
      - name: Web parity's compare self-test (a custom build of the same version passes, anything else fails)
        run: node sim/core/tools/web_parity.mjs --self-test
      - name: The sim's load split (the core's load compiles none of the director)
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://sim/core/tools/load_split.gd'
      # The rollback core (docs/net/rollback.md section 6): two peers over the loopback must match a straight run's gameplay hash at every confirmed tick; about a minute.
      - name: Rollback check (two peers over the loopback match the straight run, LAN and two lossy profiles)
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://net/tools/rollback_check.gd -- --seeds=1 --ticks=300 --profiles=lan,p80j,p200'
      - name: Rollback check, negative control (two deliberate breaks must be caught)
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://net/tools/rollback_check.gd -- --seeds=1 --ticks=240 --profiles=lan,p80j,p200 --negative-control'
      - name: Render determinism (gameplay hashes match with the scene running)
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://render/tools/determinism.gd'
      - name: Render seam sweep
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --script res://render/tools/seam_sweep.gd -- --size=1280x720'

  # Builds the Pages site on every run, so a broken export shows up on pull requests
  # and branches too. Only pushes to main (and manual runs on main) upload it.
  site:
    name: Build site (Godot web export)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
        with:
          web-templates: 'true'
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      # build_info.json (commit and commit date) for the feedback report; git-ignored, packed by the export's include_filter.
      - name: Write build_info.json
        run: node tools/write-build-info.mjs --commit "${GITHUB_SHA}"
      # The freeze breadcrumbs (docs/perf/phone-freeze-2026-10-26.md): local-only, folded into THIS checkout's Web preset only when tools/site.json says "crumbs": true; off otherwise (the step prints which).
      - name: Fold the freeze breadcrumbs into the Web preset (only when tools/site.json says so)
        run: node tools/site-crumbs.mjs --apply
      - name: Export Web (Compatibility, single-threaded)
        run: |
          mkdir -p "${RUNNER_TEMP}/web"
          "$GODOT" --headless --path . --export-release "Web" "${RUNNER_TEMP}/web/index.html"
      # Research's band prototype (a standalone project, research/band-proto), hosted at /band/. Throwaway: it is not
      # validated or tested, and build-site shares /play/'s engine files when they are identical.
      - name: Export the band prototype (Web)
        run: |
          "$GODOT" --headless --path research/band-proto --import
          mkdir -p "${RUNNER_TEMP}/band"
          "$GODOT" --headless --path research/band-proto --export-release "Web" "${RUNNER_TEMP}/band/index.html"
      # PINNED DEPLOY (docs/tools/site-interim.md): when the site is online (an interim, or a full release pass) its /play/ is the Web build of the commit the pass file RECORDED, not of
      # HEAD, so main keeps moving while the published game stays the measured one. HEAD's export above is still built and checked on every run. Offline: no pin, nothing changes.
      - name: Resolve the pinned commit (the recorded pass's, when the site is online)
        id: pin
        run: |
          # an online site with no usable record fails here, with the reason
          PIN=$(node tools/site-pin.mjs)
          echo "sha=$PIN" >> "$GITHUB_OUTPUT"
      - name: Export the pinned commit's Web build (same way as HEAD's)
        if: steps.pin.outputs.sha != ''
        run: node tools/site-pin.mjs --export "${RUNNER_TEMP}/pinned-web" --tree "${RUNNER_TEMP}/pinned-tree"
      - name: Assemble the site (/, /play/, /bench/, /band/; the plain notice only while tools/site.json says offline; the pinned build when online)
        env:
          PIN: ${{ steps.pin.outputs.sha }}
        run: |
          if [ -n "$PIN" ]; then
            node tools/build-site.mjs --web "${RUNNER_TEMP}/pinned-web" --out "${RUNNER_TEMP}/site" --commit "$PIN" --band "${RUNNER_TEMP}/band"
          else
            node tools/build-site.mjs --web "${RUNNER_TEMP}/web" --out "${RUNNER_TEMP}/site" --commit "${GITHUB_SHA}" --band "${RUNNER_TEMP}/band"
          fi
      # With "offline": true in tools/site.json the output must hold no game: no .wasm, no .pck, no script, only the notice pages. Fails the job if it does.
      - name: Check the offline site holds no game
        run: |
          node tools/check-site-offline.mjs --site "${RUNNER_TEMP}/site"
          if grep -q '"offline": true' tools/site.json; then
            if find "${RUNNER_TEMP}/site" \( -name '*.wasm' -o -name '*.pck' \) | grep -q .; then echo "an offline site holds a .wasm or .pck"; exit 1; fi
          fi
      # With an "interim" block in tools/site.json the playable site is built under Legal's interim terms. The check fails the job if the page autoplays, if any page or link leads
      # around the click-through, if Reduce flashing is not on by default in the shipped prefs, if the interim has expired or its words are a draft. Without the block it passes.
      - name: Check the interim site (click-through, no autoplay, no skip, Reduce flashing default, expiry)
        env:
          PIN: ${{ steps.pin.outputs.sha }}
        run: |
          # the shipped prefs and the feedback target are the pinned tree's, not HEAD's
          if [ -n "$PIN" ]; then ROOT="${RUNNER_TEMP}/pinned-tree"; else ROOT="."; fi
          node tools/check-site-interim.mjs --site "${RUNNER_TEMP}/site" --root "$ROOT"
      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: [qa, sim, data, flash, godot-parity, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
