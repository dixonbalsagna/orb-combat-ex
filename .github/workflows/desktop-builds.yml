# Desktop builds for Windows, Linux and macOS (docs/tools/desktop-builds.md). By hand only (workflow_dispatch): exports the three desktop presets of a commit headless with the pinned Godot
# and templates from setup-godot, packs each as a folder with README.txt, NOTICES.txt and build_info.json, proves what a Linux runner can prove, and uploads three artifacts.
#   - TWO AUDIENCES (Legal RL-262, docs/legal/desktop-build-rulings.md section 3; Tools, 2026-11-14): the input `audience`.
#       owner-private (the default): a build for Orb and Orb 2 only. No approval file is needed and NOTHING IS UPLOADED: every upload step and the two Windows-runner jobs (which download the Windows zip) carry
#         `if: inputs.audience == 'outside-testers'`, and tools/check-desktop-audience.mjs (in CI) fails when one does not. The run exports, packs, checks and plays the Linux bench; it proves the build
#         can be made. The file for Orb is made on Orb's own PC with tools/desktop-package.mjs (RL-262 section 1) and moves by drive or private message, never by this run.
#       outside-testers: everything below as before (the recorded yes, the lock, one-day files).
#     Both audiences refuse a ref that is not a commit on main, a package check that fails (route scan, notices, no net/), and a feedback target that is a public issue (ui/data/send.json).
#     "owner-private builds are made locally and never uploaded; only a locked outside-tester package, after Orb's recorded yes, may be kept as a run file, for one day (Legal RL-262)."
#   - DESKTOP TEST BUILDS FOR OUTSIDE TESTERS (Legal RL-203, RL-204): a run needs Orb's yes naming desktop test builds RECORDED in the commit it builds (docs/ep/approvals/desktop-test-builds.txt, three lines: `date:`,
#     `scope:` naming desktop test builds, `recorded-by:`; the input below must equal that date and the date must be at most 30 days old; CD-12), keeps its
#     files ONE day, and the EP deletes the run once the testers have them. No link, post or mention anywhere. Nothing from a run is a release, a Legal pass or a store build.
#   - This is the ONLY workflow that uploads a game binary (the Linux-only linux-export.yml was folded into it: the Linux export, bench and hash check are below, behind the same lock and route scan; CD-12).
#   - Every run step uses bash with `-eo pipefail` (the workflow default below), so a piped `gate.mjs ... | tee` fails when gate.mjs fails.
#   - Reduce flashing is always LOCKED ON in these builds (the same one-word edit the site's export makes, Legal RL-156); there is no input to turn it off. The run refuses unless the lock is true, the
#     capture hook is off, the route scan is clean and no command-line flag can reach normal mode (tools/desktop-package.mjs routes), and unless online play is out of the package.
#   - Linux is also played: the exported binary runs the game's bench headless and must print the project's own gameplay hash. Windows and macOS cannot be started on a Linux runner,
#     so they are read, not run: files, magic bytes, the embedded pck, the lock, the notices (tools/desktop-package.mjs verify).
#   - Nothing is signed or notarized (no Apple account, no certificate: zero budget). The macOS app carries Godot's ad-hoc signature only.
name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to build (empty: the commit this workflow was started on)'
        required: false
        default: ''
      frames:
        description: 'Frames (= ticks at --fixed-fps 60) the Linux bench plays before it prints the gameplay hash'
        required: false
        default: '2400'
      audience:
        description: 'owner-private: for Orb and Orb 2, no approval file, nothing uploaded. outside-testers: needs Orb''s recorded yes, files kept one day (Legal RL-262).'
        required: true
        type: choice
        options:
          - owner-private
          - outside-testers
        default: owner-private
      orbs_yes:
        description: 'outside-testers only: date (YYYY-MM-DD) of Orb saying yes to desktop test builds (Legal RL-203). It must equal the date in docs/ep/approvals/desktop-test-builds.txt at the commit built; the run refuses otherwise. Leave empty for owner-private.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash   # GitHub's `bash` is `bash --noprofile --norc -eo pipefail {0}`: the default shell on Linux is `bash -e {0}`, which loses a pipe's exit code (the tee'd gate.mjs steps; CD-12)

jobs:
  desktop:
    name: Desktop builds (Windows, Linux, macOS), export, pack and check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      linux_hash: ${{ steps.hashes.outputs.linux_hash }}
    env:
      FRAMES: ${{ inputs.frames }}
      ORBS_YES: ${{ inputs.orbs_yes }}
      AUDIENCE: ${{ inputs.audience }}
    steps:
      - name: The audience is one of the two
        run: |
          case "${AUDIENCE}" in
            owner-private) echo "owner-private: no approval file is needed and nothing will be uploaded (Legal RL-262)";;
            outside-testers) echo "outside-testers: Orb's recorded yes is required and files are kept one day (Legal RL-203, RL-262)";;
            *) echo "audience must be owner-private or outside-testers (got '${AUDIENCE}')"; exit 1;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Both audiences: only a commit on main is built (Legal RL-262 section 3). GitHub's compare says "identical" or "behind" when the commit is main's own or an ancestor of it.
      - name: Refuse a commit that is not on main (RL-262)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          st=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" --jq .status)
          echo "the commit ${sha} against main: ${st}"
          if [ "${st}" != "identical" ] && [ "${st}" != "behind" ]; then echo "only a commit on main is built (the compare says '${st}')"; exit 1; fi
      # A recorded approval, not a date typed into a form (CD-12): a committed file of the commit being built names the yes, and the typed date must match it. Outside testers only: an owner-private run needs none (RL-262).
      - name: Refuse without Orb's recorded yes (Legal RL-203)
        if: inputs.audience == 'outside-testers'
        run: |
          f=docs/ep/approvals/desktop-test-builds.txt
          if ! printf '%s' "${ORBS_YES}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then echo "orbs_yes must be a date, YYYY-MM-DD"; exit 1; fi
          if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then echo "no run without Orb's yes recorded in $f (committed in the commit being built; Legal RL-203, CD-12)"; exit 1; fi
          d=$(sed -n 's/^date: *//p' "$f" | head -n1)
          if ! grep -Eiq '^scope:.*desktop test builds' "$f"; then echo "$f does not name desktop test builds in a scope: line"; exit 1; fi
          if ! grep -Eq '^recorded-by: *[^ ]' "$f"; then echo "$f has no recorded-by: line"; exit 1; fi
          if [ "$d" != "${ORBS_YES}" ]; then echo "orbs_yes (${ORBS_YES}) is not the recorded date (${d:-none}) in $f"; exit 1; fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$d" +%s) ) / 86400 ))
          if [ "$age" -lt 0 ] || [ "$age" -gt 30 ]; then echo "the recorded yes of ${d} is ${age} days old (0 to 30 allowed): ask Orb again and record the new date"; exit 1; fi
          echo "Orb's recorded yes of ${d} (${age} days old)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: ./.github/actions/setup-godot
        with:
          desktop-templates: 'true'
      - name: The commit being built
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "building ${sha} for ${AUDIENCE}, Reduce flashing locked on"
          if [ -n "${ORBS_YES}" ]; then echo "Orb's yes of ${ORBS_YES}"; fi
      # The interim's terms hold for a download too: one word in this checkout's ui/data/features.json, before the import and every export below.
      - name: Lock Reduce flashing on
        run: node tools/desktop-package.mjs lock --root "${GITHUB_WORKSPACE}"
      # The version number (tools/version.json; A-TOOLS-07) into the Windows exe's version fields and the macOS app's version, on this checkout only; the game's own copy of it is build_info.json, written below
      - name: Version number into the export presets (this checkout only)
        run: node tools/desktop-package.mjs version --root "${GITHUB_WORKSPACE}"
      # Refuses unless the lock is true and the capture hook false, the route scan (Legal RL-195/196) is clean, the six bypass words are the reviewed ones and nothing a flag can set reaches the lock,
      # the option, the register or the debug key, no network class is packed, and net/ is excluded from the three desktop presets (online play is out: the README's privacy line depends on it).
      - name: Refuse unless the lock holds and no flag reaches normal mode (RL-203, RL-204)
        run: node tools/desktop-package.mjs routes --root "${GITHUB_WORKSPACE}"
      # Godot refuses a universal (Intel and Apple silicon) macOS export unless ETC2/ASTC import is on. The game imports no textures, so it changes nothing else; it is set on this checkout only
      # (project.godot in the repository stays as it is: a change to it is a full flash set, RL-128).
      - name: Enable ETC2/ASTC import for the universal macOS export
        run: node tools/desktop-package.mjs astc --root "${GITHUB_WORKSPACE}"
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      # build_info.json (commit and commit date), git-ignored, packed into each export by the presets' include_filter and copied beside the game too.
      - name: Write build_info.json
        run: node tools/write-build-info.mjs --commit "${{ steps.commit.outputs.sha }}"
      - name: Export Windows (release, Compatibility, x86_64, pck embedded)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/windows"
          "$GODOT" --headless --path . --export-release "Windows Desktop" "${RUNNER_TEMP}/export/windows/orb-combat-ex.exe"
          ls -l "${RUNNER_TEMP}/export/windows"
      - name: Export Linux (release, Compatibility, x86_64, pck embedded)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/linux"
          "$GODOT" --headless --path . --export-release "Linux" "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          chmod +x "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          ls -l "${RUNNER_TEMP}/export/linux"
      - name: Export macOS (release, universal, ad-hoc signature only)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/macos"
          "$GODOT" --headless --path . --export-release "macOS" "${RUNNER_TEMP}/export/macos/orb-combat-ex.zip"
          ls -l "${RUNNER_TEMP}/export/macos"
      - name: The project's bench (the reference hash)
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --fixed-fps 60 -- --seed=4 --frames="${FRAMES}" --bench | tee "${RUNNER_TEMP}/bench-project.txt"'
      - name: The exported Linux binary's bench (it boots headless and plays)
        working-directory: ${{ runner.temp }}/export/linux
        run: 'node "${GITHUB_WORKSPACE}/tools/gate.mjs" -- ./orb-combat-ex.x86_64 --headless --fixed-fps 60 -- --seed=4 --frames="${FRAMES}" --bench | tee "${RUNNER_TEMP}/bench-linux.txt"'
      - name: The two gameplay hashes match
        id: hashes
        run: |
          a=$(grep -m1 "^gameplay hash at tick" "${RUNNER_TEMP}/bench-project.txt" || true)
          b=$(grep -m1 "^gameplay hash at tick" "${RUNNER_TEMP}/bench-linux.txt" || true)
          echo "project:  ${a:-none}"
          echo "exported: ${b:-none}"
          if [ -z "$a" ] || [ "$a" != "$b" ]; then echo "the exported Linux build does not play the same match"; exit 1; fi
          echo "linux_hash=${b}" >> "$GITHUB_OUTPUT"
      # One folder per platform: the game, README.txt, NOTICES.txt, build_info.json. Windows and macOS as .zip, Linux as .tar.gz (the tar keeps the executable bit; an artifact zip does not).
      - name: Pack the three folders
        run: |
          set -euo pipefail
          pkg="${RUNNER_TEMP}/pkg"; dist="${RUNNER_TEMP}/dist"; exp="${RUNNER_TEMP}/export"
          mkdir -p "${pkg}" "${dist}"
          # the words the README carries: an owner-private build carries the OWNER-APPROVED notice (tools/site-interim-owner.json, Orb's own, final); an outside-testers package carries the site's active notice
          # (tools/site.json interim.notice), which must be final, and is refused while it is a draft (Legal RL-204). No other value is ever passed (tools/check-desktop-audience.mjs).
          notice=(); if [ "${AUDIENCE}" = "owner-private" ]; then notice=(--notice site-interim-owner.json --private); fi
          declare -A dir=( [windows]=orb-combat-ex-windows-x86_64 [linux]=orb-combat-ex-linux-x86_64 [macos]=orb-combat-ex-macos-universal )
          for p in windows linux macos; do
            mkdir -p "${pkg}/${dir[$p]}"
            node tools/desktop-package.mjs text --platform "${p}" --out "${pkg}/${dir[$p]}" --build-info build_info.json "${notice[@]}"
          done
          cp "${exp}/windows/orb-combat-ex.exe" "${pkg}/${dir[windows]}/"
          cp "${exp}/linux/orb-combat-ex.x86_64" "${pkg}/${dir[linux]}/"
          chmod +x "${pkg}/${dir[linux]}/orb-combat-ex.x86_64"
          unzip -q "${exp}/macos/orb-combat-ex.zip" -d "${pkg}/${dir[macos]}"
          cd "${pkg}"
          zip -q -r -X "${dist}/orb-combat-ex-windows-x86_64.zip" orb-combat-ex-windows-x86_64
          zip -q -r -y -X "${dist}/orb-combat-ex-macos-universal.zip" orb-combat-ex-macos-universal
          tar -czf "${dist}/orb-combat-ex-linux-x86_64.tar.gz" orb-combat-ex-linux-x86_64
          cd "${dist}"
          sha256sum ./* | tee SHA256SUMS.txt
          ls -l "${dist}"
      # What a player does first: unpack each archive somewhere new and read what came out.
      - name: Unpack each archive and check the folder (files, magic bytes, pck, notices, lock)
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/dist"; chk="${RUNNER_TEMP}/check"
          mkdir -p "${chk}/windows" "${chk}/linux" "${chk}/macos"
          unzip -q "${dist}/orb-combat-ex-windows-x86_64.zip" -d "${chk}/windows"
          tar -xzf "${dist}/orb-combat-ex-linux-x86_64.tar.gz" -C "${chk}/linux"
          unzip -q "${dist}/orb-combat-ex-macos-universal.zip" -d "${chk}/macos"
          flag="--locked"
          notice=(); if [ "${AUDIENCE}" = "owner-private" ]; then notice=(--notice site-interim-owner.json --private); fi
          sha="${{ steps.commit.outputs.sha }}"
          node tools/desktop-package.mjs verify --platform windows --dir "${chk}/windows/orb-combat-ex-windows-x86_64" --commit "${sha}" "${flag}" "${notice[@]}"
          node tools/desktop-package.mjs verify --platform linux --dir "${chk}/linux/orb-combat-ex-linux-x86_64" --commit "${sha}" "${flag}" "${notice[@]}"
          node tools/desktop-package.mjs verify --platform macos --dir "${chk}/macos/orb-combat-ex-macos-universal" --commit "${sha}" "${flag}" "${notice[@]}"
      - name: What this run kept
        run: |
          {
            echo "### Desktop build on ${{ steps.commit.outputs.sha }} for ${AUDIENCE}"
            echo
            if [ "${AUDIENCE}" = "owner-private" ]; then
              echo "- owner-private: exported, packed and checked (route scan, notices, lock, the Linux bench's gameplay hash). **Nothing was uploaded** (Legal RL-262)."
              echo "- The Windows runner jobs are skipped: they need the Windows zip, which this audience never uploads."
              echo "- The file for Orb and Orb 2 is made on Orb's own PC with tools/desktop-package.mjs and moves by drive or private message."
            else
              echo "- outside-testers: Orb's recorded yes of ${ORBS_YES}; three packages kept for one day; the EP deletes the run once the testers have the files."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.audience == 'outside-testers'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orb-combat-ex-windows-x86_64-${{ steps.commit.outputs.sha }}
          path: |
            ${{ runner.temp }}/dist/orb-combat-ex-windows-x86_64.zip
            ${{ runner.temp }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
      - if: inputs.audience == 'outside-testers'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orb-combat-ex-linux-x86_64-${{ steps.commit.outputs.sha }}
          path: |
            ${{ runner.temp }}/dist/orb-combat-ex-linux-x86_64.tar.gz
            ${{ runner.temp }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
      - if: inputs.audience == 'outside-testers'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orb-combat-ex-macos-universal-${{ steps.commit.outputs.sha }}
          path: |
            ${{ runner.temp }}/dist/orb-combat-ex-macos-universal.zip
            ${{ runner.temp }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  # A Windows runner starts the Windows build (A-TOOLS-13, the A1 brief's amendment; Tools, 2026-11-14): the packed zip of the job above is unpacked and its exe plays the same bench match headless; its gameplay
  # hash must be the Linux build's. Behind the same lock as the job it needs (it never runs without it). Nothing here uploads anything.
  windows-bench:
    if: inputs.audience == 'outside-testers'   # they download the Windows zip, which an owner-private run never uploads (Legal RL-262)
    name: Windows build plays the bench match and prints the Linux build's hash
    needs: desktop
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      FRAMES: ${{ inputs.frames }}
      LINUX_HASH: ${{ needs.desktop.outputs.linux_hash }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: orb-combat-ex-windows-x86_64-${{ needs.desktop.outputs.sha }}
          path: ${{ runner.temp }}/dl
      - name: Unpack the zip
        run: |
          mkdir -p "${RUNNER_TEMP}/win"
          7z x -y "${RUNNER_TEMP}/dl/orb-combat-ex-windows-x86_64.zip" -o"${RUNNER_TEMP}/win" > /dev/null
          ls -l "${RUNNER_TEMP}/win/orb-combat-ex-windows-x86_64"
      - name: The exported Windows build's bench (it starts and plays)
        working-directory: ${{ runner.temp }}/win/orb-combat-ex-windows-x86_64
        run: |
          ./orb-combat-ex.exe --headless --fixed-fps 60 -- --seed=4 --frames="${FRAMES}" --bench | tee "${RUNNER_TEMP}/bench-windows.txt"
      - name: The Windows and Linux gameplay hashes match
        run: |
          w=$(grep -m1 "^gameplay hash at tick" "${RUNNER_TEMP}/bench-windows.txt" || true)
          echo "windows: ${w:-none}"
          echo "linux:   ${LINUX_HASH:-none}"
          if [ -z "$w" ] || [ "$w" != "${LINUX_HASH}" ]; then echo "the Windows build does not play the same match as the Linux build"; exit 1; fi
          { echo '### Windows bench'; echo; echo "- the Windows build printed: $w"; echo "- the Linux build printed:   ${LINUX_HASH}"; echo '- they match'; } >> "$GITHUB_STEP_SUMMARY"

  # The Windows build's first picture (A-TOOLS-13; required by the amendment): the exe is started with a window, on the runner's own desktop, through ANGLE (OpenGL ES over Direct3D, software WARP when there is no
  # GPU, which a hosted runner has not), and ONE still of the screen is kept for a day. Never run on a runner before: if the window does not open or the still is one flat colour, the job fails and its summary says what
  # the game printed. The binary is not uploaded.
  windows-still:
    if: inputs.audience == 'outside-testers'   # they download the Windows zip, which an owner-private run never uploads (Legal RL-262)
    name: Windows build opens a window and one still is taken
    needs: desktop
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: orb-combat-ex-windows-x86_64-${{ needs.desktop.outputs.sha }}
          path: ${{ runner.temp }}/dl
      - name: Unpack the zip
        run: |
          mkdir -p "${RUNNER_TEMP}/win"
          7z x -y "${RUNNER_TEMP}/dl/orb-combat-ex-windows-x86_64.zip" -o"${RUNNER_TEMP}/win" > /dev/null
      - name: Start the game and take one still of the screen
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'win\orb-combat-ex-windows-x86_64'
          $still = Join-Path $env:RUNNER_TEMP 'still'
          New-Item -ItemType Directory -Force $still | Out-Null
          $log = Join-Path $still 'game.txt'
          $p = Start-Process -FilePath (Join-Path $dir 'orb-combat-ex.exe') -ArgumentList '--rendering-driver','opengl3_angle','--resolution','1280x720' -PassThru -RedirectStandardOutput $log -RedirectStandardError (Join-Path $still 'game-err.txt')
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $png = Join-Path $still 'windows-still.png'
          $bmp.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          # the number of distinct colours in a sample of the picture: one flat colour is a failed start
          $seen = New-Object 'System.Collections.Generic.HashSet[int]'
          for ($y = 0; $y -lt $bmp.Height; $y += 9) { for ($x = 0; $x -lt $bmp.Width; $x += 9) { [void]$seen.Add($bmp.GetPixel($x, $y).ToArgb()) } }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $fence = '```'
          $lines = @('### Windows build opened a window', '', "- the game was still running after 30 s: $alive", "- the still: $($b.Width)x$($b.Height), $($seen.Count) distinct colours in a sample", '', 'the first lines the game printed:', '', $fence)
          $lines += (Get-Content $log -TotalCount 25 -ErrorAction SilentlyContinue)
          $lines += (Get-Content (Join-Path $still 'game-err.txt') -TotalCount 25 -ErrorAction SilentlyContinue)
          $lines += $fence
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $lines | Out-File -Encoding utf8 (Join-Path $still 'summary.md')
          if (-not $alive) { throw 'the game did not stay up for 30 seconds' }
          if ($seen.Count -lt 8) { throw "the still is nearly one colour ($($seen.Count) in the sample)" }
      - name: Keep the still and the game's first lines (one day; the binary is not kept)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-still
          path: |
            ${{ runner.temp }}/still/windows-still.png
            ${{ runner.temp }}/still/summary.md
            ${{ runner.temp }}/still/game.txt
            ${{ runner.temp }}/still/game-err.txt
          retention-days: 1
          if-no-files-found: warn
