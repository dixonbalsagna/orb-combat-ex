# Desktop builds for Windows, Linux and macOS (docs/tools/desktop-builds.md). By hand only (workflow_dispatch): exports the three desktop presets of a commit headless with the pinned Godot
# and templates from setup-godot, packs each as a folder with README.txt, NOTICES.txt and build_info.json, proves what a Linux and a Windows runner can prove, and keeps nothing.
#   - OWNER-PRIVATE ONLY (Legal RL-262; the EP's decision of 2026-11-25). This workflow proves the build can be made and UPLOADS NOTHING: no run file, no release, no page. A run file on a public repository is a
#     public download, and the testers' report-channel line is not kept in git or in a repository secret, so TESTERS' PACKAGES ARE MADE ON ORB'S PC:
#       node tools/desktop-local-build.mjs --audience testers --builds-yes <date of Orb's recorded yes>
#     and the file for Orb and Orb 2 is made there too (no --audience) and moves by drive or private message. tools/check-desktop-audience.mjs (in CI) fails if an upload, a download, a publishing step or the
#     testers' words come back into this file.
#     It refuses a ref that is not a commit on main, a package check that fails (route scan, notices, no net/), and a feedback target that is a public issue (ui/data/send.json).
#   - No workflow uploads a game binary (the Linux-only linux-export.yml was folded into this one: the Linux export, bench and hash check are below, behind the same lock and route scan; CD-12).
#   - Every run step uses bash with `-eo pipefail` (the workflow default below), so a piped `gate.mjs ... | tee` fails when gate.mjs fails.
#   - Reduce flashing is always LOCKED ON in these builds (the same one-word edit the site's export makes, Legal RL-156); there is no input to turn it off. The run refuses unless the lock is true, the
#     capture hook is off, the route scan is clean and no command-line flag can reach normal mode (tools/desktop-package.mjs routes), and unless online play is out of the package.
#   - Linux is also played: the exported binary runs the game's bench headless and must print the project's own gameplay hash. Windows and macOS cannot be started on a Linux runner,
#     so they are read, not run: files, magic bytes, the embedded pck, the lock, the notices (tools/desktop-package.mjs verify).
#   - Nothing is signed or notarized (no Apple account, no certificate: zero budget). The macOS app carries Godot's ad-hoc signature only.
name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to build (empty: the commit this workflow was started on)'
        required: false
        default: ''
      frames:
        description: 'Frames (= ticks at --fixed-fps 60) the Linux bench plays before it prints the gameplay hash'
        required: false
        default: '2400'
      audience:
        description: 'owner-private only (for Orb and Orb 2; nothing is uploaded). Testers'' packages are made on Orb''s PC: node tools/desktop-local-build.mjs --audience testers (Legal RL-262).'
        required: true
        type: choice
        options:
          - owner-private
        default: owner-private

permissions:
  contents: read

defaults:
  run:
    shell: bash   # GitHub's `bash` is `bash --noprofile --norc -eo pipefail {0}`: the default shell on Linux is `bash -e {0}`, which loses a pipe's exit code (the tee'd gate.mjs steps; CD-12)

jobs:
  desktop:
    name: Desktop builds (Windows, Linux, macOS), export, pack and check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      linux_hash: ${{ steps.hashes.outputs.linux_hash }}
    env:
      FRAMES: ${{ inputs.frames }}
      AUDIENCE: ${{ inputs.audience }}
    steps:
      - name: The audience is owner-private
        run: |
          case "${AUDIENCE}" in
            owner-private) echo "owner-private: nothing will be uploaded (Legal RL-262)";;
            *) echo "this workflow builds owner-private only (got '${AUDIENCE}'). A testers' package is made on Orb's PC: node tools/desktop-local-build.mjs --audience testers"; exit 1;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Only a commit on main is built (Legal RL-262 section 3). GitHub's compare says "identical" or "behind" when the commit is main's own or an ancestor of it.
      - name: Refuse a commit that is not on main (RL-262)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          st=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" --jq .status)
          echo "the commit ${sha} against main: ${st}"
          if [ "${st}" != "identical" ] && [ "${st}" != "behind" ]; then echo "only a commit on main is built (the compare says '${st}')"; exit 1; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: ./.github/actions/setup-godot
        with:
          desktop-templates: 'true'
      - name: The commit being built
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "building ${sha} for ${AUDIENCE}, Reduce flashing locked on"
      # The interim's terms hold for a download too: one word in this checkout's ui/data/features.json, before the import and every export below.
      - name: Lock Reduce flashing on
        run: node tools/desktop-package.mjs lock --root "${GITHUB_WORKSPACE}"
      # The version number (tools/version.json; A-TOOLS-07) into the Windows exe's version fields and the macOS app's version, on this checkout only; the game's own copy of it is build_info.json, written below
      - name: Version number into the export presets (this checkout only)
        run: node tools/desktop-package.mjs version --root "${GITHUB_WORKSPACE}"
      # Refuses unless the lock is true and the capture hook false, the route scan (Legal RL-195/196) is clean, the six bypass words are the reviewed ones and nothing a flag can set reaches the lock,
      # the option, the register or the debug key, no network class is packed, and net/ is excluded from the three desktop presets (online play is out: the README's privacy line depends on it).
      - name: Refuse unless the lock holds and no flag reaches normal mode (RL-203, RL-204)
        run: |
          node tools/desktop-package.mjs routes --root "${GITHUB_WORKSPACE}" --no-testers
      # Godot refuses a universal (Intel and Apple silicon) macOS export unless ETC2/ASTC import is on. The game imports no textures, so it changes nothing else; it is set on this checkout only
      # (project.godot in the repository stays as it is: a change to it is a full flash set, RL-128).
      - name: Enable ETC2/ASTC import for the universal macOS export
        run: node tools/desktop-package.mjs astc --root "${GITHUB_WORKSPACE}"
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      # build_info.json (commit and commit date), git-ignored, packed into each export by the presets' include_filter and copied beside the game too.
      - name: Write build_info.json
        run: node tools/write-build-info.mjs --commit "${{ steps.commit.outputs.sha }}"
      - name: Export Windows (release, Compatibility, x86_64, pck embedded)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/windows"
          "$GODOT" --headless --path . --export-release "Windows Desktop" "${RUNNER_TEMP}/export/windows/orb-combat-ex.exe"
          ls -l "${RUNNER_TEMP}/export/windows"
      - name: Export Linux (release, Compatibility, x86_64, pck embedded)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/linux"
          "$GODOT" --headless --path . --export-release "Linux" "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          chmod +x "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          ls -l "${RUNNER_TEMP}/export/linux"
      - name: Export macOS (release, universal, ad-hoc signature only)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/macos"
          "$GODOT" --headless --path . --export-release "macOS" "${RUNNER_TEMP}/export/macos/orb-combat-ex.zip"
          ls -l "${RUNNER_TEMP}/export/macos"
      - name: The project's bench (the reference hash)
        run: 'node tools/gate.mjs -- "$GODOT" --headless --path . --fixed-fps 60 -- --seed=4 --frames="${FRAMES}" --bench | tee "${RUNNER_TEMP}/bench-project.txt"'
      - name: The exported Linux binary's bench (it boots headless and plays)
        working-directory: ${{ runner.temp }}/export/linux
        run: 'node "${GITHUB_WORKSPACE}/tools/gate.mjs" -- ./orb-combat-ex.x86_64 --headless --fixed-fps 60 -- --seed=4 --frames="${FRAMES}" --bench | tee "${RUNNER_TEMP}/bench-linux.txt"'
      - name: The two gameplay hashes match
        id: hashes
        run: |
          a=$(grep -m1 "^gameplay hash at tick" "${RUNNER_TEMP}/bench-project.txt" || true)
          b=$(grep -m1 "^gameplay hash at tick" "${RUNNER_TEMP}/bench-linux.txt" || true)
          echo "project:  ${a:-none}"
          echo "exported: ${b:-none}"
          if [ -z "$a" ] || [ "$a" != "$b" ]; then echo "the exported Linux build does not play the same match"; exit 1; fi
          echo "linux_hash=${b}" >> "$GITHUB_OUTPUT"
      # X-28 (path to Alpha 1, job 14): a scratch export of this commit with a crash probe is started on the runner and made to crash and to hang; the log it leaves must say why. Uploads nothing.
      - name: Forced-crash check of the Linux program (a log is left, says why, and is kept by the next start)
        run: |
          node tools/crash/crash-check.mjs --godot "$GODOT" --expect-report --out "${RUNNER_TEMP}/crash-linux.md" || rc=$?
          cat "${RUNNER_TEMP}/crash-linux.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "${rc:-0}"
      # One folder per platform: the game, README.txt, NOTICES.txt, build_info.json. Windows and macOS as .zip, Linux as .tar.gz (the tar keeps the executable bit; an artifact zip does not).
      - name: Pack the three folders
        run: |
          set -euo pipefail
          pkg="${RUNNER_TEMP}/pkg"; dist="${RUNNER_TEMP}/dist"; exp="${RUNNER_TEMP}/export"
          mkdir -p "${pkg}" "${dist}"
          # the words the README carries: the OWNER-APPROVED notice (tools/site-interim-owner.json, Orb's own, final). A testers' package carries other words and is never made here (tools/check-desktop-audience.mjs)
          notice=(--notice site-interim-owner.json --private)
          declare -A dir=( [windows]=orb-combat-ex-windows-x86_64 [linux]=orb-combat-ex-linux-x86_64 [macos]=orb-combat-ex-macos-universal )
          for p in windows linux macos; do
            mkdir -p "${pkg}/${dir[$p]}"
            node tools/desktop-package.mjs text --platform "${p}" --out "${pkg}/${dir[$p]}" --build-info build_info.json "${notice[@]}"
          done
          cp "${exp}/windows/orb-combat-ex.exe" "${pkg}/${dir[windows]}/"
          cp "${exp}/linux/orb-combat-ex.x86_64" "${pkg}/${dir[linux]}/"
          chmod +x "${pkg}/${dir[linux]}/orb-combat-ex.x86_64"
          unzip -q "${exp}/macos/orb-combat-ex.zip" -d "${pkg}/${dir[macos]}"
          cd "${pkg}"
          zip -q -r -X "${dist}/orb-combat-ex-windows-x86_64.zip" orb-combat-ex-windows-x86_64
          zip -q -r -y -X "${dist}/orb-combat-ex-macos-universal.zip" orb-combat-ex-macos-universal
          tar -czf "${dist}/orb-combat-ex-linux-x86_64.tar.gz" orb-combat-ex-linux-x86_64
          cd "${dist}"
          sha256sum ./* | tee SHA256SUMS.txt
          ls -l "${dist}"
      # What a player does first: unpack each archive somewhere new and read what came out.
      - name: Unpack each archive and check the folder (files, magic bytes, pck, notices, lock)
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/dist"; chk="${RUNNER_TEMP}/check"
          mkdir -p "${chk}/windows" "${chk}/linux" "${chk}/macos"
          unzip -q "${dist}/orb-combat-ex-windows-x86_64.zip" -d "${chk}/windows"
          tar -xzf "${dist}/orb-combat-ex-linux-x86_64.tar.gz" -C "${chk}/linux"
          unzip -q "${dist}/orb-combat-ex-macos-universal.zip" -d "${chk}/macos"
          flag="--locked"
          notice=(--notice site-interim-owner.json --private)
          sha="${{ steps.commit.outputs.sha }}"
          node tools/desktop-package.mjs verify --platform windows --dir "${chk}/windows/orb-combat-ex-windows-x86_64" --commit "${sha}" "${flag}" --no-testers "${notice[@]}"
          node tools/desktop-package.mjs verify --platform linux --dir "${chk}/linux/orb-combat-ex-linux-x86_64" --commit "${sha}" "${flag}" --no-testers "${notice[@]}"
          node tools/desktop-package.mjs verify --platform macos --dir "${chk}/macos/orb-combat-ex-macos-universal" --commit "${sha}" "${flag}" --no-testers "${notice[@]}"
      - name: What this run kept
        run: |
          {
            echo "### Desktop build on ${{ steps.commit.outputs.sha }} (owner-private)"
            echo
            echo "- exported, packed and checked (route scan, notices, lock, the Linux bench's gameplay hash). **Nothing was uploaded** (Legal RL-262)."
            echo "- The file for Orb and Orb 2 is made on Orb's own PC with tools/desktop-local-build.mjs and moves by drive or private message."
            echo "- A testers' package is made there too: node tools/desktop-local-build.mjs --audience testers."
          } >> "$GITHUB_STEP_SUMMARY"

  # A-TOOLS-13 on the owner-private route (the EP, 2026-11-21): the Windows exe is MADE ON A WINDOWS RUNNER, so no artifact crosses from the Linux job and nothing is uploaded (Legal RL-262: an owner-private run keeps nothing).
  # It exports the commit the first job built with Godot's Windows editor and the Windows release template (both pinned and SHA-512 checked), starts the exe, plays the same bench match headless and compares its gameplay
  # hash with the Linux build's (a job OUTPUT, text), then starts the game with a window and takes one still of the screen. The still is not kept (a kept file is an upload): the summary says whether the game stayed up and
  # how many distinct colours the picture had, and shows the game's first lines. Never run on a runner before: read the first run.
  windows-local:
    name: Windows build made and started on a Windows runner (nothing uploaded)
    needs: desktop
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      FRAMES: ${{ inputs.frames }}
      LINUX_HASH: ${{ needs.desktop.outputs.linux_hash }}
      SHA: ${{ needs.desktop.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.desktop.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      # The Windows editor and the one template the Windows preset uses, each SHA-512 checked against the release's SHA512-SUMS.txt (the same templates.tpz pin as .github/actions/setup-godot).
      - name: Install Godot 4.7.2 for Windows and its Windows release template
        working-directory: ${{ runner.temp }}
        env:
          GODOT_VERSION: 4.7.2-stable
          GODOT_ZIP_SHA512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
          TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_win64.exe.zip"
          echo "${GODOT_ZIP_SHA512}  godot.zip" | sha512sum -c -
          7z x -y godot.zip -o"${RUNNER_TEMP}/godot-win" > /dev/null
          rm godot.zip
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "${TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
          dest="${APPDATA}/Godot/export_templates/4.7.2.stable"
          mkdir -p "${dest}"
          # the console wrapper is its own template (windows_release_x86_64_console.exe): with the preset asking for it the export copies it beside the exe as orb-combat-ex.console.exe (run 44897597667: with only the windowed template the preset's value of 2 wrote nothing)
          7z e -y templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -o"${dest}" > /dev/null
          rm templates.tpz
          ls -l "${dest}"
          test -f "${dest}/windows_release_x86_64_console.exe"
          echo "GODOT=${RUNNER_TEMP}/godot-win/Godot_v${GODOT_VERSION}_win64_console.exe" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/godot-win/Godot_v${GODOT_VERSION}_win64_console.exe" --version
      # The same preparation of this checkout as the first job (the lock, the version fields, ETC2/ASTC import), so the exe is the one the first job packs; the route scan and the notices were done by the first job.
      - name: Prepare this checkout as the first job does
        run: |
          node tools/desktop-package.mjs lock --root "${GITHUB_WORKSPACE}"
          node tools/desktop-package.mjs version --root "${GITHUB_WORKSPACE}"
          node tools/desktop-package.mjs astc --root "${GITHUB_WORKSPACE}"
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      - name: Write build_info.json
        run: node tools/write-build-info.mjs --commit "${SHA}"
      # Run 44896954723 (the first dispatch, on d168a518): the export made orb-combat-ex.exe alone, and the bench step found no orb-combat-ex.console.exe. The preset's debug/export_console_wrapper=1 means "debug exports only" and this is a
      # release export; 2 is "debug and release". The value is changed in THIS RUNNER'S checkout only (the preset in the repository, the desktop package and the Linux and macOS exports are not touched, and nothing from this job is kept),
      # so the exe that is exported is the one the packages ship, plus the console wrapper beside it, which is the same engine and the same pck.
      - name: Ask the Windows preset for the console wrapper on a release export (this runner's checkout only)
        run: |
          awk '/^name="Windows Desktop"/{w=1} /^name="Linux"/{w=0} w && /^debug\/export_console_wrapper=1/{sub(/=1/,"=2")} {print}' export_presets.cfg > export_presets.new
          mv export_presets.new export_presets.cfg
          if [ "$(grep -c '^debug/export_console_wrapper=2' export_presets.cfg)" != "1" ]; then echo "the Windows preset's console wrapper was not set exactly once"; exit 1; fi
          grep -n 'export_console_wrapper' export_presets.cfg
      - name: Export Windows (release, Compatibility, x86_64, pck embedded) on the Windows runner
        run: |
          mkdir -p "${RUNNER_TEMP}/export/windows"
          "$GODOT" --headless --path . --export-release "Windows Desktop" "${RUNNER_TEMP}/export/windows/orb-combat-ex.exe"
          ls -l "${RUNNER_TEMP}/export/windows"
      # The console wrapper (asked for in the step above) is the same engine and the same pck with a console, so its stdout is the bench's; the shipped exe is the windowed one beside it.
      - name: The exported Windows build starts and plays the bench match
        working-directory: ${{ runner.temp }}/export/windows
        run: './orb-combat-ex.console.exe --headless --fixed-fps 60 -- --seed=4 --frames="${FRAMES}" --bench | tee "${RUNNER_TEMP}/bench-windows.txt"'
      - name: The Windows and Linux gameplay hashes match
        run: |
          w=$(grep -m1 "^gameplay hash at tick" "${RUNNER_TEMP}/bench-windows.txt" || true)
          echo "windows: ${w:-none}"
          echo "linux:   ${LINUX_HASH:-none}"
          if [ -z "$w" ] || [ "$w" != "${LINUX_HASH}" ]; then echo "the Windows build does not play the same match as the Linux build"; exit 1; fi
          { echo '### Windows bench (made and run on a Windows runner)'; echo; echo "- the Windows build printed: $w"; echo "- the Linux build printed:   ${LINUX_HASH}"; echo '- they match'; } >> "$GITHUB_STEP_SUMMARY"
      # The windowed exe is started on the runner's own desktop through ANGLE (Direct3D with software WARP: a hosted runner has no GPU), one still is taken and measured, and NOT kept. If the window does not open or the picture is one flat colour the job fails and the summary has what the game printed.
      - name: Start the game with a window and measure one still of the screen (not kept)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'export\windows\orb-combat-ex.exe'
          $out = Join-Path $env:RUNNER_TEMP 'still'
          New-Item -ItemType Directory -Force $out | Out-Null
          $log = Join-Path $out 'game.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--rendering-driver','opengl3_angle','--resolution','1280x720' -PassThru -RedirectStandardOutput $log -RedirectStandardError (Join-Path $out 'game-err.txt')
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $seen = New-Object 'System.Collections.Generic.HashSet[int]'
          for ($y = 0; $y -lt $bmp.Height; $y += 9) { for ($x = 0; $x -lt $bmp.Width; $x += 9) { [void]$seen.Add($bmp.GetPixel($x, $y).ToArgb()) } }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $fence = '```'
          $lines = @('### Windows build opened a window (made on a Windows runner; the still is not kept)', '', "- the game was still running after 30 s: $alive", "- the screen: $($b.Width)x$($b.Height), $($seen.Count) distinct colours in a sample", '', 'the first lines the game printed:', '', $fence)
          $lines += (Get-Content $log -TotalCount 25 -ErrorAction SilentlyContinue)
          $lines += (Get-Content (Join-Path $out 'game-err.txt') -TotalCount 25 -ErrorAction SilentlyContinue)
          $lines += $fence
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (-not $alive) { throw 'the game did not stay up for 30 seconds' }
          if ($seen.Count -lt 8) { throw "the screen is nearly one colour ($($seen.Count) in the sample)" }
