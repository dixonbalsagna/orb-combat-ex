# The numbers half of the one-click first run, on Linux (Tools, 2026-11-23; path to Alpha 1, job 8; docs/tools/first-run.md). By hand only (workflow_dispatch).
# Legal RL-270 (docs/legal/review-log.md, committed 93c83689): "Yes, with conditions. The warning exists so a person sees it before light reaches their eyes; on a virtual display no person's eyes are in the path, so the key
# press hurts no one and the kit rule (never on a screen a person watches) is kept." Its conditions, and where each is kept here:
#   1 the build is the shipped one, with the warning and its place in the start path unchanged; the workflow presses a key and adds no skip flag, test switch or build option, in any package a person receives: the same lock and
#     route scan as the desktop builds; tools/first-run/linux-numbers.mjs adds no argument but the seed, --print-fps and window options (its self-test fails on a bypass word, --frames, --bench or --shot);
#   2 no person watches that display, and nothing from it is streamed or shown live: Xvfb started by this job, and the script refuses to press a key unless GITHUB_ACTIONS is true, DISPLAY names an X display and this job set
#     FIRST_RUN_VIRTUAL_DISPLAY=1;
#   3 it saves no stills, video or screen capture, and uploads only text and numbers (frame rate, load times, exit result), with no account name or path (G13): no capture tool is installed, there is no upload step, the
#     summary is cleaned of folder paths;
#   4 its output is a performance reading only and never counts toward G4, G21 or any flash number (RL-224 (6)): the report says so; software GL is not a graphics card;
#   5 dispatch-only, never on push, and it never produces a package file for download (RL-262).
# Keys are pressed 250 ms apart (xdotool --delay 250: about 15 frames at 60 a second).
# The job exports the "Linux" preset of a commit on main, starts the program on the virtual display with the Compatibility renderer on software GL, presses Return on the flashing-effects warning, plays steps.json's keys
# (the list of modes, a fighter, Start, play, pause, Quit, "Close the game"), reads the frame-rate and load lines the program itself prints, and checks the program closes by itself. Software GL is NOT a graphics card: the frame rates
# say what a runner without one does, not what a player's PC does.
name: Linux first run (numbers only)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to build (empty: the commit this workflow was started on); it must be on main'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash   # GitHub's `bash` is `bash --noprofile --norc -eo pipefail {0}`

jobs:
  first-run:
    name: Linux build on a virtual display, frame rate and loading (numbers only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Refuse a commit that is not on main (RL-262)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          st=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" --jq .status)
          echo "the commit ${sha} against main: ${st}"
          if [ "${st}" != "identical" ] && [ "${st}" != "behind" ]; then echo "only a commit on main is built (the compare says '${st}')"; exit 1; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: ./.github/actions/setup-godot
        with:
          linux-templates: 'true'
      - name: Lock Reduce flashing on (the same one-word edit the desktop builds make)
        run: node tools/desktop-package.mjs lock --root "${GITHUB_WORKSPACE}"
      - name: Refuse unless the lock holds and no flag reaches normal mode
        run: node tools/desktop-package.mjs routes --root "${GITHUB_WORKSPACE}"
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      - name: Write build_info.json
        run: node tools/write-build-info.mjs --commit "$(git rev-parse HEAD)"
      - name: Export Linux (release, Compatibility, x86_64, pck embedded)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/linux"
          "$GODOT" --headless --path . --export-release "Linux" "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          chmod +x "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          cp build_info.json "${RUNNER_TEMP}/export/linux/"
          ls -l "${RUNNER_TEMP}/export/linux"
      - name: A virtual display, the software GL it needs, and the key presser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool libgl1-mesa-dri libglx-mesa0 libxcursor1 libxi6 libxrandr2 libxinerama1 libxkbcommon0
      - name: Play the first run's keys and read the numbers (no still, no capture)
        env:
          DISPLAY: ':99'
          FIRST_RUN_VIRTUAL_DISPLAY: '1'
        run: |
          Xvfb :99 -screen 0 1280x720x24 > "${RUNNER_TEMP}/xvfb.txt" 2>&1 &
          xvfb_pid=$!
          sleep 3
          rc=0
          node tools/first-run/linux-numbers.mjs --exe "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64" --out "${RUNNER_TEMP}/first-run-linux.md" || rc=$?
          kill "${xvfb_pid}" 2>/dev/null || true
          { echo '### Linux first run, numbers only'; echo; cat "${RUNNER_TEMP}/first-run-linux.md"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit "${rc}"
