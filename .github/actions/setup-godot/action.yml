# Installs the pinned Godot 4.7.2 (standard build, Linux) and, optionally, the Web or Linux export
# templates. Every download is SHA-512 verified before use. Nothing binary is committed.
# Sets GODOT to the binary for later steps. Docs: docs/tools/README.md
#
# To bump Godot: change the version and both SHA-512 values below together (they come
# from the release's SHA512-SUMS.txt) and update docs/tools/README.md.
name: Set up Godot
description: Pinned, checksum-verified Godot 4.7.2 for Linux runners

inputs:
  web-templates:
    description: 'Also install the Web (single-threaded) export templates'
    required: false
    default: 'false'
  linux-templates:
    description: 'Also install the Linux x86_64 release export template'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Godot 4.7.2
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GODOT_VERSION: 4.7.2-stable
        GODOT_ZIP_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      run: |
        set -euo pipefail
        curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
        echo "${GODOT_ZIP_SHA512}  godot.zip" | sha512sum -c -
        unzip -q godot.zip
        mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
        chmod +x godot
        rm godot.zip
        ./godot --version
        echo "GODOT=${RUNNER_TEMP}/godot" >> "$GITHUB_ENV"

    - name: Install Web export templates 4.7.2
      if: inputs.web-templates == 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GODOT_VERSION: 4.7.2-stable
        # SHA-512 of Godot_v4.7.2-stable_export_templates.tpz (1.28 GB, all platforms).
        TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
      run: |
        set -euo pipefail
        curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
        echo "${TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
        dest="${HOME}/.local/share/godot/export_templates/4.7.2.stable"
        mkdir -p "${dest}"
        # Only the single-threaded Web templates (no cross-origin isolation needed on Pages).
        unzip -q -j templates.tpz templates/version.txt templates/web_nothreads_release.zip templates/web_nothreads_debug.zip -d "${dest}"
        rm templates.tpz
        ls -l "${dest}"

    - name: Install Linux export template 4.7.2
      if: inputs.linux-templates == 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GODOT_VERSION: 4.7.2-stable
        # The same templates.tpz and SHA-512 as the Web step above.
        TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
      run: |
        set -euo pipefail
        curl -fsSL -o templates-linux.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
        echo "${TEMPLATES_SHA512}  templates-linux.tpz" | sha512sum -c -
        dest="${HOME}/.local/share/godot/export_templates/4.7.2.stable"
        mkdir -p "${dest}"
        # Only the x86_64 release template (the Steam Deck and desktop Linux).
        unzip -q -o -j templates-linux.tpz templates/version.txt templates/linux_release.x86_64 -d "${dest}"
        rm templates-linux.tpz
        ls -l "${dest}"
