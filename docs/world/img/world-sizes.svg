<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#10161f"/>
  <text x="24" y="34" font-size="20" fill="#e8eef7" font-weight="600">World sizes: one lap of the planet flat out</text>
  <text x="24" y="56" font-size="12" fill="#9fb0c4">Each size doubles the loop. Bars are seconds for one lap: pale blue at a base fighter's 5,000 units a second, orange at the maximum 11,525. Medium is today's planet.</text>
  <g font-size="13" fill="#e8eef7">
    <!-- scale: 2.1 px per second, origin x=170 -->
    <text x="24" y="104">Tiny</text>
    <text x="24" y="116" font-size="10" fill="#9fb0c4">1,200 cols, 38,400 u</text>
    <rect x="170" y="88" width="16.8" height="14" fill="#8fc4ff"/><text x="194" y="100" font-size="11" fill="#cfe3ff">8 s</text>
    <rect x="170" y="104" width="6.3" height="10" fill="#ffb066"/><text x="184" y="113" font-size="11" fill="#ffd2a8">3 s</text>

    <text x="24" y="168">Small</text>
    <text x="24" y="180" font-size="10" fill="#9fb0c4">2,400 cols, 76,800 u</text>
    <rect x="170" y="152" width="32.4" height="14" fill="#8fc4ff"/><text x="210" y="164" font-size="11" fill="#cfe3ff">15 s</text>
    <rect x="170" y="168" width="14.7" height="10" fill="#ffb066"/><text x="192" y="177" font-size="11" fill="#ffd2a8">7 s</text>

    <text x="24" y="232" font-weight="700">Medium</text>
    <text x="24" y="244" font-size="10" fill="#9fb0c4">4,800 cols, 153,600 u (today)</text>
    <rect x="170" y="216" width="65" height="14" fill="#8fc4ff"/><text x="243" y="228" font-size="11" fill="#cfe3ff">31 s</text>
    <rect x="170" y="232" width="28" height="10" fill="#ffb066"/><text x="206" y="241" font-size="11" fill="#ffd2a8">13 s</text>

    <text x="24" y="296">Big</text>
    <text x="24" y="308" font-size="10" fill="#9fb0c4">9,600 cols, 307,200 u</text>
    <rect x="170" y="280" width="129" height="14" fill="#8fc4ff"/><text x="307" y="292" font-size="11" fill="#cfe3ff">61 s</text>
    <rect x="170" y="296" width="56" height="10" fill="#ffb066"/><text x="234" y="305" font-size="11" fill="#ffd2a8">27 s</text>

    <text x="24" y="360">Huge</text>
    <text x="24" y="372" font-size="10" fill="#9fb0c4">19,200 cols, 614,400 u</text>
    <rect x="170" y="344" width="258" height="14" fill="#8fc4ff"/><text x="436" y="356" font-size="11" fill="#cfe3ff">123 s</text>
    <rect x="170" y="360" width="112" height="10" fill="#ffb066"/><text x="290" y="369" font-size="11" fill="#ffd2a8">53 s</text>

    <text x="24" y="412" font-weight="700" fill="#ffd36e">COLOSSAL</text>
    <text x="24" y="424" font-size="10" fill="#9fb0c4">38,400 cols, 1.23 million u</text>
  </g>
  <rect x="170" y="396" width="516" height="14" fill="#8fc4ff"/><text x="694" y="408" font-size="11" fill="#cfe3ff">246 s (4 min)</text>
  <rect x="170" y="412" width="224" height="10" fill="#ffb066"/><text x="402" y="421" font-size="11" fill="#ffd2a8">107 s</text>
</svg>
