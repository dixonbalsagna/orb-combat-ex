<text x="24.0" y="34.0" font-size="20" font-weight="700" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >K3. What it is like inside a smaller arena</text>
<text x="24.0" y="56.0" font-size="13" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >To scale: the loop of 38,400 units seen from above, then a screen with two fighters. Looking toward the middle, the far side of the loop is across the way.</text>
