<text x="528.0" y="128.0" font-size="11" font-weight="400" fill="#7b8696" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >the far side of the loop</text>
<text x="528.0" y="144.0" font-size="11" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >the centre (here a city's towers) always straight behind</text>
<text x="952.0" y="354.0" font-size="10" font-weight="400" fill="#5a6070" text-anchor="end" font-family="Segoe UI, system-ui, Arial, sans-serif" >not to scale in depth; fighters to scale across</text>
<text x="520.0" y="410.0" font-size="15" font-weight="700" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >What it does</text>
<text x="520.0" y="434.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >The camera looks toward the middle, so the </text>
<text x="520.0" y="450.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >centre of the loop is always behind the fight, </text>
<text x="520.0" y="466.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >and the far side of the loop is a skyline across </text>
<text x="520.0" y="482.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >the way. The arena "circles round a point" </text>
<text x="520.0" y="498.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >because that point never leaves the background. </text>
<text x="520.0" y="520.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >The wrap and the seam: a loop wraps exactly as </text>
<text x="520.0" y="536.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >the great circle does (shortest arc round, no </text>
<text x="520.0" y="552.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >seam to mark). The only change is its length: </text>
<text x="520.0" y="568.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >the sim's 153,600-unit world becomes 76,800 or </text>
<text x="520.0" y="584.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >38,400 (section 3 of the note). </text>
<text x="520.0" y="606.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >The lap: flat out, 15 s round the great circle, </text>
<text x="520.0" y="622.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >7.5 s round a loop of 76,800, 3.8 s round one of </text>
<text x="520.0" y="638.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >38,400. A fight a screen wide covers 2% of the </text>
<text x="520.0" y="654.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >great circle and 8% of the smallest loop. </text>
<text x="60.0" y="720.0" font-size="13" font-weight="700" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >The three arenas against a screen and two fighters 750 units apart</text>
