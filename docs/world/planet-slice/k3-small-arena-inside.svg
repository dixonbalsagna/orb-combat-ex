<text x="250.0" y="328.0" font-size="11" font-weight="400" fill="#5a6070" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" >6,177 units from the line</text>
<polygon points="208.3,460.0 291.7,460.0 250.0,120.0" fill="#2f6fed" fill-opacity="0.18" stroke="#2f6fed" stroke-width="1"/>
