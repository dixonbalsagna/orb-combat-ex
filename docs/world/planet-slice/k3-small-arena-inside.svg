<text x="250.0" y="110.0" font-size="12" font-weight="700" fill="#1d2230" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" >the far side of the loop: 12,222 units across the way</text>
<text x="60.0" y="82.0" font-size="13" font-weight="700" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >From above, the loop of 38,400 units (radius 6,111)</text>
<text x="60.0" y="500.0" font-size="11" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >Pink: the line the fighters move along. Pale pink: the band they fight in (2,400 units deep).</text>
<text x="60.0" y="516.0" font-size="11" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >Blue: what the camera sees, looking in toward the middle.</text>
<text x="520.0" y="96.0" font-size="13" font-weight="700" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >What the camera sees (one screen, 3,000 units across, fighters 75 tall)</text>
