<text x="752.0" y="152.0" font-size="11" font-weight="700" fill="#d6336c" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >bell tower, in the fight</text>
<path d="M 800 367 l 4 12 l -8 0 Z" fill="#d6336c" fill-opacity="0.45"/><rect x="798" y="379" width="4" height="61" fill="#d6336c" fill-opacity="0.45"/>
<text x="660.0" y="366.0" font-size="11" font-weight="700" fill="#d6336c" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >the same tower, faint, behind the street</text>
<text x="520.0" y="478.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >Both fights hold the same buildings with the same names and the same seed; only the line through them changes. A damaged city</text>
<text x="520.0" y="494.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >could keep its damage between fights if Orb wants that (question 3 in the note).</text>
<rect x="30" y="520" width="940" height="150" rx="6" fill="#fff" stroke="#c9ccd6"/>
<text x="48.0" y="548.0" font-size="14" font-weight="700" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >How a city becomes a strip</text>
<text x="48.0" y="574.0" font-size="12" font-weight="400" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >1  A city is stored as a centre, a radius, a seed and its districts as rings (and a few wedges: harbour, industrial).</text>
<text x="48.0" y="594.0" font-size="12" font-weight="400" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >2  The line passes at an offset d from the centre. At distance s along it the point is rho = sqrt(s^2 + d^2) from the centre.</text>
<text x="48.0" y="614.0" font-size="12" font-weight="400" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >3  The district at rho picks the building kinds and heights (data we already have), the seed picks the exact buildings, so both fights agree.</text>
<text x="48.0" y="634.0" font-size="12" font-weight="400" fill="#1d2230" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >4  Landmarks are fixed points of the plan. A landmark within the band is in the fight; a landmark further off is the backdrop skyline (World's data, Rendering's picture).</text>
<text x="48.0" y="654.0" font-size="12" font-weight="400" fill="#5a6070" text-anchor="start" font-family="Segoe UI, system-ui, Arial, sans-serif" >5  The same city seen from the opposite side is mirrored: nothing else is needed.</text>
</svg>