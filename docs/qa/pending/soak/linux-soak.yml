# PROPOSED, not live (QA, path job 14): the two-hour soak's Linux half. It would go to .github/workflows/ (Tools' path) after Legal's word (it runs the build headless with main's --frames switch, which also skips
# the first-run card and the flashing notice; there is no display, nothing is captured and no program is kept or uploaded). Dispatch only. About 125 runner minutes a run; the repository is public.
# The build steps mirror linux-first-run.yml (lock, routes check, import, build_info, export "Linux"); the pinned action versions are the same.
name: Linux soak (two hours, headless, numbers only)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to build (empty: the commit this workflow was started on); it must be on main'
        required: false
        default: ''
      seconds:
        description: 'Soak length in seconds'
        required: false
        default: '7200'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  soak:
    name: Linux build, computer against computer, headless
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Refuse a commit that is not on main (RL-262)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          st=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" --jq .status)
          if [ "${st}" != "identical" ] && [ "${st}" != "behind" ]; then echo "only a commit on main is built (the compare says '${st}')"; exit 1; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: ./.github/actions/setup-godot
        with:
          linux-templates: 'true'
      - name: Lock Reduce flashing on (the same one-word edit the desktop builds make)
        run: node tools/desktop-package.mjs lock --root "${GITHUB_WORKSPACE}"
      - name: Refuse unless the lock holds and no flag reaches normal mode
        run: node tools/desktop-package.mjs routes --root "${GITHUB_WORKSPACE}"
      - name: Import project
        run: '"$GODOT" --headless --path . --import'
      - name: Write build_info.json
        run: node tools/write-build-info.mjs --commit "$(git rev-parse HEAD)"
      - name: Export Linux (release)
        run: |
          mkdir -p "${RUNNER_TEMP}/export/linux"
          "$GODOT" --headless --path . --export-release "Linux" "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          chmod +x "${RUNNER_TEMP}/export/linux/orb-combat-ex.x86_64"
          cp build_info.json "${RUNNER_TEMP}/export/linux/"
      - name: Soak (headless; no display, no capture)
        env:
          SECONDS_ASKED: ${{ inputs.seconds }}
        run: |
          rc=0
          node qa/soak/soak.mjs --package "${RUNNER_TEMP}/export/linux" --seconds "${SECONDS_ASKED:-7200}" --out "${RUNNER_TEMP}/soak" || rc=$?
          { echo '### Linux soak, numbers only'; echo; cat "${RUNNER_TEMP}/soak/summary.md"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit "${rc}"
      - name: Keep the numbers (text only; never the program)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-numbers
          path: |
            ${{ runner.temp }}/soak/summary.md
            ${{ runner.temp }}/soak/summary.json
            ${{ runner.temp }}/soak/samples.csv
          retention-days: 14
